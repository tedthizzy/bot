name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: secrets, deps, schemas, caps, kotlin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: secret scan
        run: ./hosts/pi/deploy/check-secrets.sh
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: sync
        run: uv sync --frozen --group dev
      - name: robotd dependency closure has no ML package
        run: make deps-check
      - name: schema drift
        run: make schema-check
      - name: generated Kotlin drift
        run: make kotlin-check
      - name: operational bounds inside the firmware fork's compiled caps
        run: .venv/bin/python -m pytest tests/unit/test_caps_match.py -v
      - name: lint
        run: make lint
  mac:
    name: unit + gates (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: sync
        run: uv sync --frozen --group dev
      - name: unit
        run: make test
      - name: gates (fast subset, against a booted sim rover)
        run: make gates-sim GATES_SIM_ARGS='-k "g2 or g4"'
      - name: gate results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-results
          path: logs/gates/
          if-no-files-found: ignore
  arm64:
    name: linux/arm64 parity
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - name: docker-dev
        run: make docker-dev
