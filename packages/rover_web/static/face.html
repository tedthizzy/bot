<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>rover face</title>
<link rel="stylesheet" href="/static/rover.css">
</head>
<body>
<nav class="bar">
  <a href="/" aria-current="page">face</a>
  <a href="/teleop">teleop</a>
  <a href="/ptt">talk</a>
  <span class="spacer"></span>
  <span class="dot" data-dot="brain">brain</span>
  <span class="dot" data-dot="robotd">robotd</span>
</nav>

<main>
  <svg id="face-svg" viewBox="0 0 400 260" role="img" aria-label="rover face">
    <rect x="0" y="0" width="400" height="260" rx="24" fill="#161b21"/>
    <g id="eyes" fill="#58a6ff">
      <ellipse id="eye-l" cx="132" cy="106" rx="30" ry="34"/>
      <ellipse id="eye-r" cx="268" cy="106" rx="30" ry="34"/>
    </g>
    <g stroke="#58a6ff" stroke-width="9" stroke-linecap="round" fill="none">
      <path id="brow-l" d="M104 62 L160 62"/>
      <path id="brow-r" d="M240 62 L296 62"/>
      <path id="mouth" d="M150 186 L250 186"/>
    </g>
  </svg>
  <div class="readout"><span id="expr">neutral</span> &middot; <span id="fsm">IDLE</span></div>
</main>

<div class="faults" id="faults" hidden></div>

<form class="stop" method="post" action="/estop">
  <button type="submit">STOP</button>
  <p class="note">hardware e-stop stays the first authority</p>
</form>

<script src="/static/rover.js"></script>
<script>
"use strict";
/* set_face's whole executor path: brain broadcasts {"type":"face"} on
   brain.sock, rover-web relays it here, this table draws it. */
const FACES = {
  neutral:  { eye: [30, 34], brow: ["M104 62 L160 62", "M240 62 L296 62"], mouth: "M150 186 L250 186" },
  happy:    { eye: [30, 26], brow: ["M104 60 L160 52", "M240 52 L296 60"], mouth: "M146 176 Q200 216 254 176" },
  thinking: { eye: [26, 30], brow: ["M104 66 L160 50", "M240 62 L296 62"], mouth: "M156 188 L226 182" },
  confused: { eye: [30, 34], brow: ["M104 50 L160 66", "M240 66 L296 50"], mouth: "M150 190 Q182 172 212 192 Q238 208 254 184" },
  alert:    { eye: [34, 40], brow: ["M104 48 L160 48", "M240 48 L296 48"], mouth: "M172 180 Q200 210 228 180" },
  sleepy:   { eye: [30, 7],  brow: ["M104 68 L160 72", "M240 72 L296 68"], mouth: "M162 188 Q200 200 238 188" },
};

const eyeL = document.getElementById("eye-l");
const eyeR = document.getElementById("eye-r");
const browL = document.getElementById("brow-l");
const browR = document.getElementById("brow-r");
const mouth = document.getElementById("mouth");
const exprLabel = document.getElementById("expr");
const fsmLabel = document.getElementById("fsm");

function draw(name) {
  const face = FACES[name];
  if (!face) return;
  for (const eye of [eyeL, eyeR]) {
    eye.setAttribute("rx", face.eye[0]);
    eye.setAttribute("ry", face.eye[1]);
  }
  browL.setAttribute("d", face.brow[0]);
  browR.setAttribute("d", face.brow[1]);
  mouth.setAttribute("d", face.mouth);
  exprLabel.textContent = name;
}

const updateFaults = Rover.faultPanel(document.getElementById("faults"));

Rover.wireStop();
Rover.pollStatus();
Rover.keepAwake();
Rover.connect((message) => {
  if (message.type === "face") draw(message.expr);
  else if (message.type === "fsm") fsmLabel.textContent = message.state;
  else if (message.type === "state") updateFaults(message);
});
draw("neutral");
</script>
</body>
</html>
